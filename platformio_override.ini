; ---------------------------------------------------------------------------
;  AI Passport custom build (fork of Tasmota)
;
;  Target : FoloToy AI Passport (ESP32-C3, 8 MB flash, ST7789P3 240x320 panel)
;  Adds   : boot screen with the Wi-Fi setup hint / connection info
;           (driver: tasmota/tasmota_xdrv_driver/xdrv_95_aipassport_screen.ino)
;
;  Build  : pio run -e tasmota32c3-aipassport
;  Flash  : pio run -e tasmota32c3-aipassport -t upload_factory   (merged image at 0x0)
;  Output : build_output/firmware/tasmota32c3-aipassport.bin
;           build_output/firmware/tasmota32c3-aipassport.factory.bin
; ---------------------------------------------------------------------------

[platformio]
default_envs                = tasmota32c3-aipassport

[env:tasmota32c3-aipassport]
extends                     = env:tasmota32c3
board                       = esp32c3
build_unflags               = ${env:tasmota32c3.build_unflags}
build_flags                 = ${env:tasmota32c3.build_flags}
                              -DUSE_AIPASSPORT_SCREEN
                              -DMY_LANGUAGE=zh_CN
